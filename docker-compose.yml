version: "3.9"
services:
  oda-music:
    build: .
    container_name: oda-music-bot
    restart: always
    environment:
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
      - BOT_TOKEN=${BOT_TOKEN}
      - OWNER_ID=${OWNER_ID}
      - STRING_SESSION=${STRING_SESSION}
    volumes:
      - ./data:/app/data
    command: python -m oda
